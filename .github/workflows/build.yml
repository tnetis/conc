name: Build conc

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"

concurrency:
  group: build-conc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check Python and Flet API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Flet
        run: python -m pip install --disable-pip-version-check "flet==1.1.2"

      - name: Compile and validate
        run: |
          python -m py_compile src/conc.py
          python scripts/check_flet_api.py

  build:
    name: Build ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # El mismo ejecutable x64 funciona en Windows 10 y Windows 11.
          - name: Windows 10/11 x86_64
            target: windows
            runner: windows-latest
            artifact: conc-windows-x86_64
            extension: .zip

          # Se compila en Ubuntu 22.04 para rebajar los requisitos de glibc.
          - name: Linux x86_64
            target: linux
            runner: ubuntu-22.04
            artifact: conc-linux-x86_64
            extension: .tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build with Flet
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: ${{ matrix.target }}
          runner-python-version: "3.14"
          bundled-python-version: "3.14"
          build-number: ${{ github.run_number }}

      - name: Give the archive a stable name
        run: >-
          python -c "import shutil, sys; shutil.copyfile(sys.argv[1], sys.argv[2])"
          "${{ steps.build.outputs.archive-path }}"
          "${{ matrix.artifact }}${{ matrix.extension }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "conc $GITHUB_REF_NAME" \
              --generate-notes
          fi
